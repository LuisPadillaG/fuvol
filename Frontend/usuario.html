<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUVOL - Perfil de Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #08121a;
            background-image: url('../img/fuvol.jpg'), url('../img/images.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            transition: background-image 0.5s ease-in-out;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 18% 45%, rgba(18, 56, 84, 0.45) 0%, rgba(8, 13, 19, 0.86) 55%, rgba(4, 5, 8, 0.95) 100%),
                linear-gradient(90deg, rgba(8, 20, 30, 0.62) 0%, rgba(6, 9, 13, 0.88) 48%, rgba(4, 4, 6, 0.94) 100%);
            pointer-events: none;
        }

        .top-nav-link {
            position: fixed;
            top: 22px;
            right: 38px;
            z-index: 100;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.45rem;
            letter-spacing: 0.04em;
            color: #ff6e59;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
            padding: 4px 10px;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .top-nav-link:hover {
            transform: translateY(-2px);
            color: #ffffff;
        }

        .app-layout {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100%;
            max-width: 1480px;
            margin: 0 auto;
        }

        .sidebar-menu {
            width: 350px;
            min-height: 100vh;
            padding: 64px 20px 64px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            user-select: none;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 38px;
        }

        .menu-link {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.1rem;
            letter-spacing: 0.02em;
            line-height: 1;
            text-decoration: none;
            width: fit-content;
            opacity: 0;
            animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s ease;
        }

        .menu-link:hover {
            transform: translateX(10px) scale(1.04);
            filter: brightness(1.3);
        }

        .color-green { color: #147a58; animation-delay: 0.08s; }
        .color-coral { color: #ff6e59; animation-delay: 0.16s; margin-left: 24px; }
        .color-blue { color: #1e287a; animation-delay: 0.24s; margin-left: 24px; }
        .color-purple { color: #5b1873; animation-delay: 0.32s; }

        .brand-container {
            margin: auto 0;
            padding: 20px 0 20px 10px;
            opacity: 0;
            animation: slideInLeft 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.14s forwards;
        }

        .giant-menu-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4.8rem, 7.8vw, 7.6rem);
            font-weight: 400;
            line-height: 0.88;
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        .profile-panel {
            flex: 1;
            padding: 36px 42px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .profile-heading {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.1rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            color: #ffffff;
            margin-bottom: 16px;
            text-align: center;
            opacity: 0;
            animation: fadeInDown 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .profile-card {
            position: relative;
            width: 100%;
            max-width: 580px;
            background-color: rgba(14, 14, 16, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 6px;
            padding: 28px 36px;
            overflow: hidden;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            opacity: 0;
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .card-watermark-bg {
            position: absolute;
            right: -35px;
            top: 50%;
            transform: translateY(-50%);
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: grayscale(100%) brightness(1.6);
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.3s ease;
        }

        .profile-form {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .user-badge-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid #17d875;
            padding: 10px 16px;
            border-radius: 4px;
        }

        .user-badge-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;
        }

        .user-badge-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.9rem;
            color: #ffffff;
            letter-spacing: 0.03em;
            line-height: 1;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.28rem;
            letter-spacing: 0.04em;
            color: #e5e7eb;
        }

        .password-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-input {
            width: 100%;
            height: 44px;
            padding: 0 95px 0 16px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .field-input:focus {
            border-color: #17d875;
            background-color: rgba(255, 255, 255, 0.09);
        }

        .toggle-pass-btn {
            position: absolute;
            right: 10px;
            height: 30px;
            padding: 0 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            color: #e5e7eb;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.92rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .toggle-pass-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .carousel-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .carousel-controls-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .carousel-arrow-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .carousel-arrow-btn:hover {
            transform: scale(1.1);
            background-color: #ff6e59;
            border-color: #ff6e59;
        }

        .carousel-arrow-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .carousel-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 118px;
        }

        .carousel-team-logo {
            width: 82px;
            height: 82px;
            object-fit: contain;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }

        .carousel-team-logo.pop-anim {
            transform: scale(0.84);
            opacity: 0.4;
        }

        .carousel-team-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.65rem;
            letter-spacing: 0.03em;
            color: #ffffff;
            line-height: 1;
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .carousel-dot.active {
            background: #ff6e59;
            transform: scale(1.25);
        }

        /* =========================================================
           RECUADRO COMPACTO PARA EL MAPA DEL ESTADIO (estadio_equipos.mapa)
           ========================================================= */
        .stadium-map-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stadium-map-iframe {
            width: 100%;
            height: 135px;
            border: 0;
            border-radius: 4px;
            background-color: #11161d;
        }

        .submit-btn {
            margin-top: 4px;
            height: 48px;
            border: none;
            border-radius: 5px;
            background-color: #17d875;
            color: #07190e;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(23, 216, 117, 0.3);
            transition: transform 0.22s ease, filter 0.22s ease;
        }

        .submit-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .status-msg {
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            min-height: 18px;
            color: #ff6e59;
        }

        .status-msg.success {
            color: #17d875;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-24px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .app-layout { flex-direction: column; }
            .sidebar-menu { width: 100%; min-height: auto; padding: 28px 24px; gap: 16px; }
            .menu-group { flex-direction: row; flex-wrap: wrap; gap: 20px; }
            .color-coral, .color-blue { margin-left: 0; }
        }
    </style>
</head>
<body>

    <button type="button" class="top-nav-link" onclick="cerrarSesion()">CERRAR SESIÓN</button>

    <div class="app-layout">
        <aside class="sidebar-menu">
            <div class="menu-group">
                <a href="index.html" class="menu-link color-green">PARTIDOS HOY</a>
                <a href="iniciar_sesion.html" class="menu-link color-coral">CAMBIAR CUENTA</a>
            </div>

            <div class="brand-container">
                <a href="index.html" class="giant-menu-title">FUVOL</a>
            </div>

            <div class="menu-group">
                <a href="nuevo_usuario.html" class="menu-link color-blue">NUEVO USUARIO</a>
                <a href="index.html" class="menu-link color-purple">VOLVER AL INICIO</a>
            </div>
        </aside>

        <main class="profile-panel">
            <h2 class="profile-heading">MI PERFIL DE USUARIO</h2>

            <section class="profile-card">
                <img id="watermarkTeamImg" src="https://media.api-sports.io/football/teams/541.png" alt="" class="card-watermark-bg">

                <form id="profileForm" class="profile-form">
                    <div class="user-badge-banner">
                        <div>
                            <div class="user-badge-label">USUARIO CONECTADO</div>
                            <div id="displayUsuario" class="user-badge-name">CARGANDO...</div>
                        </div>
                        <span style="font-size: 0.78rem; color: #17d875; font-weight: 700;">● ACTIVO</span>
                    </div>

                    <div class="field-group">
                        <label for="inputPassword" class="field-label">TU CONTRASEÑA (VER Y EDITAR)</label>
                        <div class="password-input-wrap">
                            <input type="text" id="inputPassword" class="field-input" required>
                            <button type="button" id="togglePassBtn" class="toggle-pass-btn" onclick="togglePasswordVisibility()">OCULTAR</button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label">ELIGE TU EQUIPO FAVORITO</label>
                        <div class="carousel-box">
                            <div class="carousel-controls-row">
                                <button type="button" class="carousel-arrow-btn" onclick="changeTeamSlide(-1)" title="Equipo anterior">
                                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                                </button>

                                <div class="carousel-stage">
                                    <img id="carouselTeamLogo" src="" alt="Logo Equipo" class="carousel-team-logo">
                                    <span id="carouselTeamName" class="carousel-team-name"></span>
                                </div>

                                <button type="button" class="carousel-arrow-btn" onclick="changeTeamSlide(1)" title="Siguiente equipo">
                                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                                </button>
                            </div>

                            <div id="carouselDots" class="carousel-dots"></div>
                        </div>
                    </div>

                    <!-- Mapa pequeño del estadio del equipo favorito (campo `mapa` de `estadio_equipos`) -->
                    <div class="field-group">
                        <label class="field-label">UBICACIÓN DEL ESTADIO</label>
                        <div class="stadium-map-box">
                            <iframe
                                id="stadiumMapIframe"
                                class="stadium-map-iframe"
                                src=""
                                allowfullscreen=""
                                loading="lazy"
                                referrerpolicy="no-referrer-when-downgrade">
                            </iframe>
                        </div>
                    </div>

                    <div id="statusMessage" class="status-msg"></div>

                    <button type="submit" class="submit-btn">GUARDAR CAMBIOS</button>
                </form>
            </section>
        </main>
    </div>

    <script>
        const PHP_ENDPOINT = 'usuarios.php';

        // 3 Equipos base con sus logos oficiales; se enriquecen con `link_img` y `mapa` desde `estadio_equipos`
        let EQUIPOS_CARRUSEL = [
            {
                nombre: 'Real Madrid CF',
                logo: 'https://media.api-sports.io/football/teams/541.png',
                link_img: '',
                //mapa: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3036.004440915295!2d-3.690522384602975!3d40.45303867936091!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd4228e23705d39f%3A0xa8fff6d26e2b1988!2sEstadio%20Santiago%20Bernab%C3%A9u!5e0!3m2!1ses-419!2smx!4v1700000000000!5m2!1ses-419!2smx'
            },
            {
                nombre: 'FC Barcelona',
                logo: 'https://media.api-sports.io/football/teams/529.png',
                link_img: '',
                //mapa: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4573.494009633034!2d2.122972890589605!3d41.380431604540085!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a498f576297baf%3A0x44f65330fe1b04b9!2sSpotify%20Camp%20Nou!5e0!3m2!1ses-419!2smx!4v1794795710693!5m2!1ses-419!2smx'
            },
            {
                nombre: 'Club América',
                logo: 'https://media.api-sports.io/football/teams/2287.png',
                link_img: '',
                //mapa: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3765.584397732028!2d-99.15288868509536!3d19.30286068695817!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85ce005208010919%3A0x952f0c05948f6e86!2sEstadio%20Azteca!5e0!3m2!1ses-419!2smx!4v1700000000000!5m2!1ses-419!2smx'
            }
        ];

        let currentTeamIndex = 0;
        let currentUsername = '';

        /**
         * Asigna el logo correcto de API-Football según el nombre_equipo guardado en `estadio_equipos`
         */
        function obtenerLogoPorNombre(nombreEquipo) {
            const norm = String(nombreEquipo || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');

            if (norm.includes('madrid')) return 'https://media.api-sports.io/football/teams/541.png';
            if (norm.includes('barcelona') || norm.includes('barca')) return 'https://media.api-sports.io/football/teams/529.png';
            if (norm.includes('america')) return 'https://media.api-sports.io/football/teams/2287.png';
            return 'https://media.api-sports.io/football/leagues/140.png';
        }

        /**
         * Aplica el `link_img` en el background del body y el `mapa` en el src del iframe
         */
        function aplicarEstadioEnPantalla(linkImg, mapaSrc) {
            if (linkImg && String(linkImg).trim() !== '') {
                document.body.style.backgroundImage = `url('${linkImg}'), url('../img/fuvol.jpg')`;
            }

            const iframeEl = document.getElementById('stadiumMapIframe');
            if (iframeEl && mapaSrc && String(mapaSrc).trim() !== '') {
                if (iframeEl.src !== mapaSrc) {
                    iframeEl.src = mapaSrc;
                }
            }
        }

        function renderCarousel() {
            const team = EQUIPOS_CARRUSEL[currentTeamIndex];
            if (!team) return;

            const logoEl = document.getElementById('carouselTeamLogo');
            const nameEl = document.getElementById('carouselTeamName');
            const watermarkEl = document.getElementById('watermarkTeamImg');
            const dotsEl = document.getElementById('carouselDots');

            logoEl.classList.add('pop-anim');
            setTimeout(() => {
                logoEl.src = team.logo;
                nameEl.textContent = team.nombre;
                watermarkEl.src = team.logo;
                logoEl.classList.remove('pop-anim');
            }, 130);

            // Actualizar el background (link_img) y el iframe (mapa) con los datos del equipo seleccionado
            aplicarEstadioEnPantalla(team.link_img, team.mapa);

            dotsEl.innerHTML = EQUIPOS_CARRUSEL.map((_, idx) => `
                <span class="carousel-dot ${idx === currentTeamIndex ? 'active' : ''}" onclick="selectTeamSlide(${idx})"></span>
            `).join('');
        }

        function changeTeamSlide(direction) {
            const total = EQUIPOS_CARRUSEL.length;
            currentTeamIndex = (currentTeamIndex + direction + total) % total;
            renderCarousel();
        }

        function selectTeamSlide(index) {
            currentTeamIndex = index;
            renderCarousel();
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('inputPassword');
            const btn = document.getElementById('togglePassBtn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                btn.textContent = 'OCULTAR';
            } else {
                passInput.type = 'password';
                btn.textContent = 'MOSTRAR';
            }
        }

        /**
         * Carga los registros de la tabla `estadio_equipos` para tener `nombre_equipo`, `link_img` y `mapa`
         */
        async function fetchEstadiosDeBaseDeDatos() {
            try {
                const res = await fetch(`${PHP_ENDPOINT}?accion=estadios`);
                if (!res.ok) return;
                const listaEstadios = await res.json();

                if (Array.isArray(listaEstadios) && listaEstadios.length > 0) {
                    EQUIPOS_CARRUSEL = listaEstadios.map(est => ({
                        nombre: est.nombre_equipo,
                        logo: obtenerLogoPorNombre(est.nombre_equipo),
                        link_img: est.link_img || '',
                        mapa: est.mapa || ''
                    }));
                }
            } catch (e) {
                console.warn('No se pudo cargar la lista completa de estadio_equipos:', e);
            }
        }

        async function loadUserProfile() {
            const rawSession = localStorage.getItem('fuvol_usuario_activo');
            if (!rawSession) {
                window.location.href = 'iniciar_sesion.html';
                return;
            }

            const sessionUser = JSON.parse(rawSession);
            currentUsername = sessionUser.usuario;

            // 1. Cargar catálogo de `estadio_equipos` desde MySQL
            await fetchEstadiosDeBaseDeDatos();

            // 2. Consultar datos del usuario + JOIN con `estadio_equipos` desde MySQL
            try {
                const res = await fetch(`${PHP_ENDPOINT}?accion=obtener&usuario=${encodeURIComponent(currentUsername)}`);
                if (res.ok) {
                    const freshData = await res.json();
                    populateUserData(freshData);
                    return;
                }
            } catch (e) {
                console.warn('Usando datos en sesión local:', e);
            }

            populateUserData(sessionUser);
        }

        function populateUserData(userObj) {
            document.getElementById('displayUsuario').textContent = userObj.usuario;
            document.getElementById('inputPassword').value = userObj.password || '';

            const equipoUsuario = String(userObj.equipo_favorito || '').toLowerCase().trim();

            let foundIndex = EQUIPOS_CARRUSEL.findIndex(
                t => t.nombre.toLowerCase().trim() === equipoUsuario
            );

            // Si el nombre guardado es parcial (ej. "Barcelona" vs "FC Barcelona"), emparejar flexiblemente
            if (foundIndex === -1 && equipoUsuario) {
                foundIndex = EQUIPOS_CARRUSEL.findIndex(
                    t => t.nombre.toLowerCase().includes(equipoUsuario) || equipoUsuario.includes(t.nombre.toLowerCase())
                );
            }

            currentTeamIndex = foundIndex !== -1 ? foundIndex : 0;

            // Si el JOIN directo de `usuarios.php?accion=obtener` devolvió `link_img` o `mapa`, asignarlos
            if (userObj.link_img) {
                EQUIPOS_CARRUSEL[currentTeamIndex].link_img = userObj.link_img;
            }
            if (userObj.mapa) {
                EQUIPOS_CARRUSEL[currentTeamIndex].mapa = userObj.mapa;
            }

            renderCarousel();
        }

        document.getElementById('profileForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const nuevaPassword = document.getElementById('inputPassword').value;
            const nuevoEquipo = EQUIPOS_CARRUSEL[currentTeamIndex].nombre;
            const statusEl = document.getElementById('statusMessage');

            statusEl.className = 'status-msg';
            statusEl.textContent = 'Guardando cambios en la base de datos fuvol...';

            try {
                const response = await fetch(`${PHP_ENDPOINT}?accion=actualizar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario: currentUsername,
                        password: nuevaPassword,
                        equipo_favorito: nuevoEquipo
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const updatedUser = {
                        usuario: currentUsername,
                        password: nuevaPassword,
                        equipo_favorito: nuevoEquipo,
                        link_img: data.link_img || EQUIPOS_CARRUSEL[currentTeamIndex].link_img,
                        mapa: data.mapa || EQUIPOS_CARRUSEL[currentTeamIndex].mapa
                    };
                    localStorage.setItem('fuvol_usuario_activo', JSON.stringify(updatedUser));

                    // Aplicar de inmediato el fondo y mapa devueltos por la relación con `estadio_equipos`
                    aplicarEstadioEnPantalla(updatedUser.link_img, updatedUser.mapa);

                    statusEl.className = 'status-msg success';
                    statusEl.textContent = '¡Contraseña, equipo favorito y estadio actualizados!';
                } else {
                    statusEl.textContent = data.error || 'Error al actualizar los datos.';
                }
            } catch (err) {
                console.error('Error actualizando perfil vía PHP:', err);
                statusEl.textContent = 'Error de conexión con usuarios.php en XAMPP.';
            }
        });

        function cerrarSesion() {
            localStorage.removeItem('fuvol_usuario_activo');
            window.location.href = 'iniciar_sesion.html';
        }

        window.onload = loadUserProfile;
    </script>
</body>
</html>
