<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUVOL - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #08121a;
            background-image: url('../img/fuvol.jpg'), url('../img/images.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 18% 45%, rgba(18, 56, 84, 0.42) 0%, rgba(8, 13, 19, 0.90) 52%, rgba(4, 5, 8, 0.98) 100%),
                linear-gradient(90deg, rgba(8, 20, 30, 0.60) 0%, rgba(6, 9, 13, 0.92) 45%, rgba(4, 4, 6, 0.98) 100%);
            pointer-events: none;
        }

        .top-nav-link {
            position: fixed;
            top: 22px;
            right: 38px;
            z-index: 100;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.45rem;
            letter-spacing: 0.04em;
            color: #ffffff;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .top-nav-link:hover {
            transform: translateY(-2px);
            color: #ff6e59;
        }

        .app-layout {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100%;
            max-width: 1480px;
            margin: 0 auto;
        }

        .sidebar-menu {
            width: 350px;
            min-height: 100vh;
            padding: 64px 20px 64px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            user-select: none;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 38px;
        }

        .menu-link {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.1rem;
            letter-spacing: 0.02em;
            line-height: 1;
            text-decoration: none;
            width: fit-content;
            opacity: 0;
            animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s ease;
        }

        .menu-link:hover {
            transform: translateX(10px) scale(1.04);
            filter: brightness(1.3);
        }

        .color-green { color: #147a58; animation-delay: 0.08s; }
        .color-coral { color: #ff6e59; animation-delay: 0.16s; margin-left: 24px; }
        .color-blue { color: #1e287a; animation-delay: 0.24s; margin-left: 24px; }
        .color-purple { color: #5b1873; animation-delay: 0.32s; }

        .brand-container {
            margin: auto 0;
            padding: 20px 0 20px 10px;
            opacity: 0;
            animation: slideInLeft 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.14s forwards;
        }

        .giant-menu-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4.8rem, 7.8vw, 7.6rem);
            font-weight: 400;
            line-height: 0.88;
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: transform 0.35s ease;
        }

        .giant-menu-title:hover {
            transform: scale(1.02) translateX(4px);
        }

        .auth-panel {
            flex: 1;
            padding: 58px 42px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .auth-heading {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.3rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            color: #ffffff;
            margin-bottom: 24px;
            text-align: center;
            opacity: 0;
            animation: fadeInDown 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .auth-card {
            position: relative;
            width: 100%;
            max-width: 520px;
            background-color: rgba(14, 14, 16, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 38px 42px;
            overflow: hidden;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.72);
            opacity: 0;
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .card-watermark-left,
        .card-watermark-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 230px;
            height: 230px;
            object-fit: contain;
            filter: grayscale(100%) brightness(1.8);
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        .card-watermark-left { left: -45px; }
        .card-watermark-right { right: -45px; }

        .auth-form {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.35rem;
            letter-spacing: 0.04em;
            color: #e5e7eb;
        }

        .field-input {
            height: 48px;
            padding: 0 16px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .field-input:focus {
            border-color: #ff6e59;
            background-color: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 3px rgba(255, 110, 89, 0.2);
        }

        .submit-btn {
            margin-top: 8px;
            height: 52px;
            border: none;
            border-radius: 5px;
            background-color: #ff6e59;
            color: #ffffff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.65rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 110, 89, 0.35);
            transition: transform 0.22s ease, background-color 0.22s ease, box-shadow 0.22s ease;
        }

        .submit-btn:hover {
            background-color: #ff563f;
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(255, 110, 89, 0.48);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .status-msg {
            font-size: 0.84rem;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
            color: #ff6e59;
        }

        .status-msg.success {
            color: #17d875;
        }

        .auth-footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .auth-footer-links a {
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-footer-links a:hover {
            color: #ff6e59;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-24px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .app-layout { flex-direction: column; }
            .sidebar-menu { width: 100%; min-height: auto; padding: 28px 24px; gap: 16px; }
            .menu-group { flex-direction: row; flex-wrap: wrap; gap: 20px; }
            .color-coral, .color-blue { margin-left: 0; }
        }
    </style>
</head>
<body>

    <a href="nuevo_usuario.html" class="top-nav-link">CREAR CUENTA</a>

    <div class="app-layout">
        <aside class="sidebar-menu">
            <div class="menu-group">
                <a href="index.html" class="menu-link color-green">PARTIDOS HOY</a>
                <a href="nuevo_usuario.html" class="menu-link color-coral">NUEVO USUARIO</a>
            </div>

            <div class="brand-container">
                <a href="index.html" class="giant-menu-title">FUVOL</a>
            </div>

            <div class="menu-group">
                <a href="usuario.html" class="menu-link color-blue">MI PERFIL</a>
                <a href="index.html" class="menu-link color-purple">VOLVER AL INICIO</a>
            </div>
        </aside>

        <main class="auth-panel">
            <h2 class="auth-heading">INICIAR SESIÓN</h2>

            <section class="auth-card">
                <img src="https://media.api-sports.io/football/leagues/2.png" alt="" class="card-watermark-left">
                <img src="https://media.api-sports.io/football/leagues/39.png" alt="" class="card-watermark-right">

                <form id="loginForm" class="auth-form">
                    <div class="field-group">
                        <label for="inputUsuario" class="field-label">NOMBRE DE USUARIO</label>
                        <input type="text" id="inputUsuario" class="field-input" placeholder="Ingresa tu usuario" required autocomplete="username">
                    </div>

                    <div class="field-group">
                        <label for="inputPassword" class="field-label">CONTRASEÑA</label>
                        <input type="password" id="inputPassword" class="field-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <div id="statusMessage" class="status-msg"></div>

                    <button type="submit" class="submit-btn">INICIAR SESIÓN</button>

                    <div class="auth-footer-links">
                        <span>¿Todavía no tienes cuenta?</span>
                        <a href="nuevo_usuario.html">REGISTRAR NUEVO USUARIO →</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script>
        const PHP_ENDPOINT = 'usuarios.php';

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const usuario = document.getElementById('inputUsuario').value.trim();
            const password = document.getElementById('inputPassword').value;
            const statusEl = document.getElementById('statusMessage');

            statusEl.className = 'status-msg';
            statusEl.textContent = 'Verificando en la base de datos fuvol...';

            try {
                const response = await fetch(`${PHP_ENDPOINT}?accion=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok && data.usuario) {
                    localStorage.setItem('fuvol_usuario_activo', JSON.stringify(data));
                    statusEl.className = 'status-msg success';
                    statusEl.textContent = '¡Inicio de sesión correcto! Redirigiendo...';

                    setTimeout(() => {
                        window.location.href = 'usuario.html';
                    }, 500);
                } else {
                    statusEl.textContent = data.error || 'Usuario o contraseña incorrectos.';
                }
            } catch (error) {
                console.error('Error conectando con usuarios.php:', error);
                statusEl.textContent = 'Error al conectar con usuarios.php en XAMPP.';
            }
        });
    </script>
</body>
</html>
